<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Node.js mechanics and engines">
  <defs>
    <linearGradient id="hexFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c873a"/>
      <stop offset="100%" stop-color="#2c5f2b"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="none"/>

  <!-- hexagon: the Node.js silhouette, drawn as a clean polygon -->
  <polygon
    points="160,20 227,60 227,140 160,180 93,140 93,60"
    fill="url(#hexFill)"
    stroke="#8bc34a"
    stroke-width="3"
    stroke-linejoin="round"/>

  <!-- event loop rings -->
  <circle cx="160" cy="100" r="17" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.92"/>
  <circle cx="160" cy="100" r="31" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.55"/>
  <circle cx="160" cy="100" r="45" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.28"/>

  <!-- the single main thread at the centre -->
  <circle cx="160" cy="100" r="6" fill="#ffffff"/>
</svg>